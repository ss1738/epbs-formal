\* NON-VACUITY SELF-TEST. Injects a known bug: a canonical block always marks
\* the payload committed, even when it was withheld or equivocated
\* (FaultBindingBug = TRUE). TLC is EXPECTED to report INV_CommitmentBinding
\* violated, proving that guarantee is not vacuously true. See MUTATIONS.md.

SPECIFICATION Spec

CONSTANTS
    Builders               = {b1, b2}
    ByzBuilders            = {b2}
    Attesters              = {a1, a2, a3}
    ByzAttesters           = {a3}
    Values                 = {1, 2}
    StartBal               = 100
    PayloadTimelyThreshold = 2
    SlashEquivocation      = FALSE
    FaultStealOnReorg      = FALSE
    FaultBindingBug        = TRUE
    NONE                   = NONE

INVARIANTS
    INV_CommitmentBinding

CHECK_DEADLOCK FALSE
