\* Larger PTC instance: 5 attesters (2 Byzantine), threshold 3 (honest 3-of-5).
\* The Byzantine pair alone cannot force "present"; the three honest ones can.
\* See SCALING.md.

SPECIFICATION Spec

CONSTANTS
    Attesters              = {a1, a2, a3, a4, a5}
    ByzAttesters           = {a4, a5}
    PayloadTimelyThreshold = 3

INVARIANTS
    TypeOK
    INV_NoFalsePresent
    INV_NoFalseAbsent
    INV_Correct

PROPERTIES
    LIVE_Decided

CHECK_DEADLOCK FALSE
