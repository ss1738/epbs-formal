\* Larger chain instance: 6 slots. Evidence that conservation and the
\* withdrawal-draining liveness hold over a longer chain. See SCALING.md.

SPECIFICATION Spec

CONSTANTS
    NumSlots = 6
    StartBal = 100
    Value    = 5

