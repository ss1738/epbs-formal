\* Multi-slot chain: 3 slots, bid value 5, builder starting balance 100.
\* Small enough to enumerate fully; large enough to exercise queued
\* withdrawals draining across slot boundaries.

SPECIFICATION Spec

CONSTANTS
    NumSlots = 3
    StartBal = 100
    Value    = 5

INVARIANTS
    TypeOK
    INV_Conservation
    INV_NonNeg
    INV_NoOverpay

PROPERTIES
    LIVE_Progress
    LIVE_Drained

CHECK_DEADLOCK FALSE
