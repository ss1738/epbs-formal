\* TLC model-checking configuration for EPBS.tla (EIP-7732 model).
\* Small finite instance: 2 builders (1 Byzantine), 3 attesters (1 Byzantine),
\* bid values {1, 2}. PayloadTimelyThreshold = 2 gives an honest 2-of-3 margin:
\* the single Byzantine attester cannot force "present", the two honest ones can.
\* SlashEquivocation = FALSE models the base EIP-7732 (no equivocation slashing).

SPECIFICATION Spec

CONSTANTS
    Builders               = {b1, b2}
    ByzBuilders            = {b2}
    Attesters              = {a1, a2, a3}
    ByzAttesters           = {a3}
    Values                 = {1, 2}
    StartBal               = 100
    PayloadTimelyThreshold = 2
    SlashEquivocation      = FALSE
    FaultStealOnReorg      = FALSE
    FaultBindingBug        = FALSE
    NONE                   = NONE

INVARIANTS
    TypeOK
    INV_G1_ProposerUnconditionalPayment
    INV_G2_BuilderRevealSafety
    INV_G3_BuilderWithholdSafety
    INV_CommitmentBinding
    INV_EquivocationNotCanonical
    INV_Conservation
    INV_NoDanglingPayment
    INV_SlashingFaithful

PROPERTIES
    LIVE_Progress

CHECK_DEADLOCK FALSE
