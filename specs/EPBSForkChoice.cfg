\* Milestone 2, SAFE parameters. Honest committee plus payload boost meets the
\* adversary's weight plus proposer boost, so HonestMajoritySafe holds:
\*   weight(B1 with payload) = 2 + 1 = 3 ; weight(reorg) = 1 + 1 = 2.
\* FC_TimelyPayloadSafe is expected to hold here.

SPECIFICATION Spec

CONSTANTS
    HonestWeight  = 2
    ByzWeight     = 1
    ProposerBoost = 1
    PayloadBoost  = 1
    StartBal      = 100
    Bid           = 5

INVARIANTS
    TypeOK
    FC_TimelyPayloadSafe
    FC_G1_ProposerPaid
    FC_G3_WithholdSafe
    FC_Binding
    FC_Conservation
    FC_NoDangling
    FC_ReorgImpliesAdversaryHeavy

PROPERTIES
    LIVE_Progress

CHECK_DEADLOCK FALSE
