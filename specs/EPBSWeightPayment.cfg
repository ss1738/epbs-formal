\* Gloas weight-quorum payment: 3 attesters (1 Byzantine), quorum 2 (honest
\* 2-of-3 margin). The Byzantine attester alone cannot reach quorum; the two
\* honest ones can. The G1/G3-style guarantees emerge from the weight dynamics.

SPECIFICATION Spec

CONSTANTS
    Attesters    = {a1, a2, a3}
    ByzAttesters = {a3}
    Quorum       = 2
    StartBal     = 100
    Value        = 5

INVARIANTS
    TypeOK
    INV_NoForcedPay
    INV_CanonicalPays
    INV_NonCanonicalRefunds
    INV_Conservation

PROPERTIES
    LIVE_Settled

CHECK_DEADLOCK FALSE
