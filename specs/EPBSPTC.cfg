\* Per-attester timed PTC model: 3 attesters (1 Byzantine), threshold 2.
\* Honest 2-of-3 margin: the Byzantine attester alone cannot force "present",
\* and the two honest ones can. INV_Correct is expected to hold, showing the
\* atomic PTC step in EPBS.tla is a sound abstraction of the timed process.

SPECIFICATION Spec

CONSTANTS
    Attesters              = {a1, a2, a3}
    ByzAttesters           = {a3}
    PayloadTimelyThreshold = 2

INVARIANTS
    TypeOK
    INV_NoFalsePresent
    INV_NoFalseAbsent
    INV_Correct

PROPERTIES
    LIVE_Decided

CHECK_DEADLOCK FALSE
