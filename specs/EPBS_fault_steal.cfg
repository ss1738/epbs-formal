\* NON-VACUITY SELF-TEST. Injects a known bug: a reorged block pays the
\* proposer instead of refunding the builder (FaultStealOnReorg = TRUE). TLC is
\* EXPECTED to report INV_G3_BuilderWithholdSafety violated, proving that
\* guarantee is not vacuously true. See MUTATIONS.md.

SPECIFICATION Spec

CONSTANTS
    Builders               = {b1, b2}
    ByzBuilders            = {b2}
    Attesters              = {a1, a2, a3}
    ByzAttesters           = {a3}
    Values                 = {1, 2}
    StartBal               = 100
    PayloadTimelyThreshold = 2
    SlashEquivocation      = FALSE
    FaultStealOnReorg      = TRUE
    FaultBindingBug        = FALSE
    NONE                   = NONE

INVARIANTS
    INV_G3_BuilderWithholdSafety

CHECK_DEADLOCK FALSE
