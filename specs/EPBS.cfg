\* TLC model-checking configuration for EPBS.tla
\* Small finite instance: 2 builders (1 Byzantine), 3 attesters (1 Byzantine),
\* bid values {1, 2}. Honest PTC majority holds (1 of 3 Byzantine).

SPECIFICATION Spec

CONSTANTS
    Builders      = {b1, b2}
    ByzBuilders   = {b2}
    Attesters     = {a1, a2, a3}
    ByzAttesters  = {a3}
    Values        = {1, 2}
    StartBal      = 100
    NONE          = NONE

INVARIANTS
    TypeOK
    INV_PaymentSafety
    INV_NoStealFromProposer
    INV_CommitmentBinding
    INV_EquivocationRejected
    INV_EquivocationSlashed
    INV_Conservation
    INV_OnlyByzSlashed
    INV_NoReorgOnWithhold

PROPERTIES
    LIVE_Progress
    LIVE_HonestRevealCanonical

CHECK_DEADLOCK FALSE
