\* Milestone 2, UNSAFE (attack) parameters. The adversary out-weighs the honest
\* committee plus the payload boost, so HonestMajoritySafe FAILS:
\*   weight(B1 with payload) = 1 + 1 = 2 ; weight(reorg) = 2 + 1 = 3.
\* FC_TimelyPayloadSafe is EXPECTED TO BE VIOLATED here: TLC returns the reorg
\* trace, demonstrating the exact threshold below which a timely payload can be
\* reorged. The payment guarantees (FC_G1, FC_G3, conservation) still hold.

SPECIFICATION Spec

CONSTANTS
    HonestWeight  = 1
    ByzWeight     = 2
    ProposerBoost = 1
    PayloadBoost  = 1
    StartBal      = 100
    Bid           = 5

INVARIANTS
    TypeOK
    FC_TimelyPayloadSafe
    FC_G1_ProposerPaid
    FC_G3_WithholdSafe
    FC_Binding
    FC_Conservation
    FC_NoDangling
    FC_ReorgImpliesAdversaryHeavy

PROPERTIES
    LIVE_Progress

CHECK_DEADLOCK FALSE
