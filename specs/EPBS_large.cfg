\* Larger single-slot instance: 3 builders (2 Byzantine), 5 attesters
\* (2 Byzantine), bid values {1,2,3}, threshold 3 (honest 3-of-5 margin).
\* Evidence that the properties hold well beyond the toy instance. See SCALING.md.

SPECIFICATION Spec

CONSTANTS
    Builders               = {b1, b2, b3}
    ByzBuilders            = {b2, b3}
    Attesters              = {a1, a2, a3, a4, a5}
    ByzAttesters           = {a4, a5}
    Values                 = {1, 2, 3}
    StartBal               = 100
    PayloadTimelyThreshold = 3
    SlashEquivocation      = FALSE
    NONE                   = NONE

INVARIANTS
    TypeOK
    INV_G1_ProposerUnconditionalPayment
    INV_G2_BuilderRevealSafety
    INV_G3_BuilderWithholdSafety
    INV_CommitmentBinding
    INV_EquivocationNotCanonical
    INV_Conservation
    INV_NoDanglingPayment
    INV_SlashingFaithful

PROPERTIES
    LIVE_Progress

CHECK_DEADLOCK FALSE
